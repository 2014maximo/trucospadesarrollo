<section class="ab-section" aria-labelledby="titulo-experiencia">
    <div class="container">
        <div class="ab-head">
            <span class="ab-eyebrow" aria-hidden="true">02</span>
            <h2 id="titulo-experiencia" class="ab-h2"><app-split-text [texto]="'experiencia' | translate" [oracion]="true"></app-split-text></h2>
        </div>

        <div class="timeline" #timeline>
            <!-- La línea se "dibuja" a medida que la línea de tiempo atraviesa la pantalla -->
            <div class="linea" aria-hidden="true">
                <div class="linea-progreso" [appScrollAnimate]="{ scaleY: [0, 1] }" [scrollTarget]="timeline" [scrollOffset]="['start 75%', 'end 60%']"></div>
            </div>

            <div class="era" *ngFor="let era of EXPERIENCES">
                <h3 class="era-title ab-mono" appReveal [revealDesde]="'izquierda'">{{ era.era | translate }}</h3>
                <article class="item" *ngFor="let experience of era.experience" appReveal [revealDesde]="'derecha'" [revealDistancia]="48" [revealDuracion]="0.6">
                    <span class="punto" aria-hidden="true"></span>
                    <p class="ab-mono fecha">{{ experience.dateRange }} · {{ experience.place }}</p>
                    <h4 class="entidad">{{ experience.entity | translate }}</h4>
                    <p class="cargo">{{ experience.workPerformed | translate }}</p>
                    <ul class="saberes">
                        <li *ngFor="let knoledge of experience.knowledgeAcquired">{{ knoledge | translate }}</li>
                    </ul>
                </article>
            </div>
        </div>
    </div>
</section>
