<div class="row bg-transparent skills">
    <div class="col-md-2"></div>
    <div class="col-md-8">
        <h3 class="title-block text-center">{{ 'tecnologias' | translate }}</h3>
        <div class="bg-dark shadow-three mt-2 remove-padding">
            <section *ngFor="let group of groups" class="tech-group">
                <h4 class="tech-group-title f-open-sans-c">{{ group.label | translate }}</h4>
                <ul class="tech-grid">
                    <li *ngFor="let tech of group.technologies" class="tech-card" [style.--brand]="tech.color">
                        <div class="tech-logo">
                            <img [src]="tech.srcImg" alt="" loading="lazy">
                        </div>
                        <span class="tech-name f-open-sans-c">{{ tech.name }}</span>
                    </li>
                </ul>
            </section>
        </div>
    </div>
    <div class="col-md-2"></div>
</div>
