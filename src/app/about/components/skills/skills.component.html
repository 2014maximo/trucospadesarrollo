<section class="ab-section" aria-labelledby="titulo-tecnologias">
    <div class="container">
        <div class="ab-head">
            <span class="ab-eyebrow" aria-hidden="true">01</span>
            <h2 id="titulo-tecnologias" class="ab-h2"><app-split-text [texto]="'tecnologias' | translate" [oracion]="true"></app-split-text></h2>
        </div>
    </div>

    <!-- Cinta decorativa; el contenido accesible es la lista por categorías de abajo -->
    <div class="marquee" [class.estatico]="estatico()" aria-hidden="true">
        @for (fila of filas; track $index; let inversa = $odd) {
        <div class="fila" #fila>
            <ul class="pista" #pista>
                @for (copia of [0, 1]; track copia) {
                @for (tech of fila; track tech.name) {
                <li class="chip" [style.--brand]="tech.color">
                    <img [src]="tech.srcImg" alt="" loading="lazy">
                    <span>{{ tech.name }}</span>
                </li>
                }
                }
            </ul>
        </div>
        }
    </div>

    <div class="container">
        <div class="row gy-4 tech-categorias" appStagger>
            <div class="col-6 col-lg-3" *ngFor="let group of groups">
                <h3 class="ab-mono categoria">{{ group.label | translate }}</h3>
                <ul class="tech-lista">
                    <li *ngFor="let tech of group.technologies">{{ tech.name }}</li>
                </ul>
            </div>
        </div>
    </div>
</section>
