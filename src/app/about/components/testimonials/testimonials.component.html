<section class="ab-section" aria-labelledby="titulo-testimonios">
    <div class="container">
        <div class="ab-head">
            <span class="ab-eyebrow" aria-hidden="true">06</span>
            <h2 id="titulo-testimonios" class="ab-h2"><app-split-text [texto]="'testimonial' | translate" [oracion]="true"></app-split-text></h2>
        </div>
        <div id="carouselTestimonials" class="carousel slide" appReveal [revealDistancia]="24" [revealDuracion]="0.6">
            <div class="carousel-inner">
                <div *ngFor="let testimonial of TESTIMONIALS; let i = index" class="carousel-item {{ i === 0 ? 'active' : '' }}">
                    <figure class="quote">
                        <span class="quote-mark ab-hand" aria-hidden="true">&ldquo;</span>
                        <blockquote class="quote-text">{{ testimonial.description | translate }}</blockquote>
                        <figcaption class="quote-author">
                            <img src="{{ testimonial.srcImg }}" alt="" width="56" height="56" class="rounded-circle">
                            <div>
                                <a [href]="testimonial.linkedinUrl" target="_blank" rel="noopener noreferrer" class="author-link">
                                    {{ testimonial.author }} <i class="bi bi-linkedin author-icon" aria-hidden="true"></i>
                                </a>
                                <span class="d-block ab-mono">{{ testimonial.workPerformed | translate }}</span>
                            </div>
                        </figcaption>
                    </figure>
                </div>
            </div>
            <div class="controls">
                <button class="control" type="button" data-bs-target="#carouselTestimonials" data-bs-slide="prev">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    <span class="visually-hidden">{{ 'ABOUT_A11Y.anterior' | translate }}</span>
                </button>
                <button class="control" type="button" data-bs-target="#carouselTestimonials" data-bs-slide="next">
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                    <span class="visually-hidden">{{ 'ABOUT_A11Y.siguiente' | translate }}</span>
                </button>
            </div>
        </div>
    </div>
</section>
