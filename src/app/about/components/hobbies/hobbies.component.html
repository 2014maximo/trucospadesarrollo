<section class="ab-section" aria-labelledby="titulo-aficiones">
    <div class="container">
        <div class="row gy-4">
            <div class="col-lg-4">
                <div class="ab-head mb-0">
                    <span class="ab-eyebrow" aria-hidden="true">04</span>
                    <h2 id="titulo-aficiones" class="ab-h2"><app-split-text [texto]="'aficiones' | translate" [oracion]="true"></app-split-text></h2>
                </div>
            </div>
            <div class="col-lg-8" appReveal [revealDistancia]="24" [revealDuracion]="0.6">
                <p class="hobbies-text">{{ 'meGusta' | translate }}</p>
                <div class="hobby-icons" aria-hidden="true" appStagger [staggerDistancia]="24">
                    <i class="bi bi-music-note"></i>
                    <i class="bi bi-geo-alt-fill"></i>
                    <i class="bi bi-controller"></i>
                    <i class="bi bi-laptop"></i>
                    <i class="bi bi-book-half"></i>
                </div>
            </div>
        </div>
    </div>
</section>
