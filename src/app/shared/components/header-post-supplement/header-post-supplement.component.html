<div class="row cabecera-post">
    <!-- Nota al margen: ícono de categoría y fecha, pegados a la columna de lectura -->
    <div class="col-md-5 nota-margen">
        <img *ngIf="rutaIcono()" [src]="rutaIcono()" alt="" height="50" width="auto" class="drop">
        <time [attr.datetime]="fecha() | date:'yyyy-MM-dd'" class="fecha-lateral tc-gray-two f-shadow-into-l fs-20 lh-20">
            {{ fecha() | date }}
        </time>
    </div>
    <div class="col-md-7">
        <h1 class="titulo-post-responsive">{{ titulo() }}</h1>

        <p *ngFor="let contenido of descripcion()" id="description" class="extracto c7 f-open-sans-c fs-20">
            {{ contenido }}
        </p>
    </div>
</div>
