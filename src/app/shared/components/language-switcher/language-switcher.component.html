<div class="dropdown f-open-sans-c text-center">
    <button #selector type="button" class="selector dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"
        [attr.aria-label]="('Idioma' | translate) + ': ' + (nombres[idiomaActual] ?? idiomaActual)">
        <img src="assets/img/icons/traduccion.png" alt="" height="40" width="auto" class="drop">
    </button>
    <ul class="dropdown-menu dropdown-menu-end bg-dark">
        <li *ngFor="let lenguaje of lenguajes">
            <button type="button" class="d-flex dropdown-item translate-item justify-content-between gap-3"
                [attr.lang]="lenguaje" (click)="procesoCambioLenguaje(lenguaje)">
                {{ nombres[lenguaje] }}
                <img src="assets/img/icons/languaje-{{lenguaje}}.png" alt="" height="20" width="auto">
            </button>
        </li>
    </ul>
</div>
