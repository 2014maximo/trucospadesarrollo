@if (mostrarItemsPorPantalla) {
<div class="d-flex justify-content-center fuenteDos">
    <select (change)="cargarCantidadElementos($event)">
        @for (valor of itemsPorPantalla; track valor) {
        <option value="{{ valor }}">{{ valor }}</option>
        }
    </select>
</div>
}
<!-- Con una sola página no hay nada que paginar -->
@if (totalPaginas().length > 1) {
<nav class="paginador" [attr.aria-label]="'PAGINADOR.navegacion' | translate">
    @for (pages of totalPaginas(); track pages.pagina) {
    <button type="button" class="pagina" [class.active]="active() === pages.pagina.toString()"
        [attr.aria-current]="active() === pages.pagina.toString() ? 'page' : null"
        [attr.aria-label]="'PAGINADOR.pagina' | translate: { numero: pages.pagina + 1 }"
        (click)="cargarPagina(pages.pagina)">{{ pages.pagina + 1 }}</button>
    }
</nav>
}
