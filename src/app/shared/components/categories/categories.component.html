<section class="est-seccion" aria-labelledby="est-titulo">
    <div class="container">
        <div class="row align-items-end gy-4">
            <div class="col-lg-4">
                <h2 id="est-titulo" class="seccion-titulo fuenteOcho">{{ 'Categorias' | translate }}</h2>
                <p class="seccion-pista f-open-sans-c">{{ 'CATEGORIAS_HOME.pista' | translate }}</p>
            </div>
            <div class="col-lg-8">
                <div class="est-estante">
                    <ul class="est-libros" appStagger [staggerDistancia]="-80" [staggerIntervalo]="0.1">
                        @for (libro of libros; track libro.ruta) {
                        <li>
                            <a class="est-libro" [routerLink]="libro.ruta" [style.--alto.px]="libro.alto" [style.--tono]="libro.tono"
                                [attr.aria-label]="libro.titulo + ' · ' + ('CATEGORIAS_HOME.verArticulos' | translate)">
                                <span class="est-cuerpo">
                                    <span class="est-lomo">
                                        <span class="est-banda" [class]="libro.colorFondo"></span>
                                        <img [src]="libro.icono" alt="" class="est-icono">
                                        <span class="est-nombre fuenteOcho">{{ libro.titulo }}</span>
                                        <span class="est-banda" [class]="libro.colorFondo"></span>
                                    </span>
                                    <span class="est-portada" [class]="libro.colorFondo">
                                        <img [src]="libro.icono" alt="" class="est-portada-icono">
                                        <span class="est-portada-titulo fuenteOcho">{{ libro.titulo }}</span>
                                        <span class="est-portada-cta f-open-sans-c">{{ 'CATEGORIAS_HOME.verArticulos' | translate }} →</span>
                                    </span>
                                </span>
                            </a>
                        </li>
                        }
                        <!-- Decoración: libros sin categoría y sujetalibros -->
                        <li aria-hidden="true"><span class="est-deco" style="--alto: 230px; --tono: #2b2620"></span></li>
                        <li aria-hidden="true"><span class="est-deco est-deco-inclinado" style="--alto: 270px; --tono: #24262b"></span></li>
                        <li aria-hidden="true"><span class="est-sujetalibros"></span></li>
                    </ul>
                    <div class="est-tabla" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </div>
</section>
